version: '3'

tasks:
  lint:
    cmds:
      - golangci-lint run
      - golangci-lint fmt --diff
  format:
    cmds:
      - golangci-lint fmt
  test:
    cmds:
      - go test -race ./...
      - go vet ./...
  build:
    cmds:
      - go build -o dist/devsy-runtime-microsandbox ./cmd/devsy-runtime-microsandbox
  pre-commit:
    cmds:
      - prek run --all-files
