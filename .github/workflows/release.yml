name: Release assets
on:
  release:
    types: [published]
permissions:
  contents: read
concurrency:
  group: release-assets-${{ github.event.release.tag_name }}
  cancel-in-progress: false
jobs:
  distribution:
    uses: ./.github/workflows/distribution.yml
    with:
      version: ${{ github.event.release.tag_name }}
  publish:
    name: Publish verified provider assets
    needs: distribution
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: provider-release
          path: dist
      - name: Upload the complete verified release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" dist/* --clobber
