name: Release assets
on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
      expected_sha:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: release-assets
  cancel-in-progress: false
jobs:
  resolve:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]
          gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft | type == "boolean"' | grep -qx true
          sha="$(gh api "repos/$GH_REPO/commits/$RELEASE_TAG" --jq .sha)"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          if [[ "$EVENT_NAME" != workflow_dispatch ]]; then
            [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
            test "$sha" = "$EXPECTED_SHA"
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
  distribution:
    needs: resolve
    uses: ./.github/workflows/distribution.yml
    with:
      version: ${{ inputs.tag }}
      ref: ${{ needs.resolve.outputs.sha }}
  publish:
    name: Publish verified provider assets
    needs: [resolve, distribution]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: provider-release-${{ inputs.tag }}
          path: dist
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          path: provider
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: provider/go.mod
      - name: Verify and publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
          EXPECTED_SHA: ${{ needs.resolve.outputs.sha }}
        run: |
          (cd dist && sha256sum --check checksums.txt && test -s provider.yaml)
          test "$(gh api "repos/$GH_REPO/commits/$RELEASE_TAG" --jq .sha)" = "$EXPECTED_SHA"
          draft="$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)"
          if [[ "$draft" == false ]]; then
            remote="$(mktemp -d)"
            trap 'rm -rf "$remote"' EXIT
            gh release download "$RELEASE_TAG" --dir "$remote" --pattern '*'
            for file in dist/*; do test -f "$remote/$(basename "$file")"; done
            cp "$remote/provider.yaml" "$remote/provider.yaml.published"
            cp "$remote/checksums.txt" "$remote/checksums.txt.published"
            (cd "$remote" && sha256sum --check checksums.txt)
            (cd provider && go run ./cmd/package-provider "$RELEASE_TAG" "$remote")
            cmp "$remote/provider.yaml.published" "$remote/provider.yaml"
            cmp "$remote/checksums.txt.published" "$remote/checksums.txt"
            cmp dist/LICENSE "$remote/LICENSE"
            cmp dist/MICROSANDBOX-SDK-LICENSE "$remote/MICROSANDBOX-SDK-LICENSE"
            exit 0
          fi
          [[ "$draft" == true ]]
          gh release upload "$RELEASE_TAG" dist/* --clobber
          response="$(mktemp)"
          trap 'rm -f "$response" "$response.err"' EXIT
          latest=true
          if gh api "repos/$GH_REPO/releases/latest" > "$response" 2> "$response.err"; then
            latest_tag="$(jq -er '.tag_name' "$response")"
            status="$(gh api "repos/$GH_REPO/compare/$latest_tag...$EXPECTED_SHA" --jq .status)"
            case "$status" in
              ahead|identical) ;;
              behind) latest=false ;;
              *) exit 1 ;;
            esac
          else
            cat "$response.err" >&2
            grep -q 'HTTP 404' "$response.err"
          fi
          rm -f "$response.err"
          gh release edit "$RELEASE_TAG" --draft=false --latest="$latest"
